<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Nexus Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Workspace Specific Styles */
        body {
            overflow: hidden; /* Prevent full page scroll in workspace */
        }
        .workspace-header {
            position: relative;
            padding: 1rem 2rem;
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        
        .workspace-layout {
            display: flex;
            height: calc(100vh - 70px);
            width: 100vw;
        }

        .sidebar {
            width: 250px;
            background: var(--secondary-bg);
            border-right: 1px solid var(--glass-border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .file-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .file-item {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item:hover, .file-item.active {
            background: var(--glass-bg);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f111a;
            border-right: 1px solid var(--glass-border);
        }

        .editor-tabs {
            display: flex;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--glass-border);
        }

        .tab {
            padding: 0.8rem 1.5rem;
            color: #94a3b8;
            cursor: pointer;
            border-right: 1px solid var(--glass-border);
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: white;
            background: #0f111a;
            border-bottom: 2px solid var(--accent);
        }

        .code-area {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #a5b4fc;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 1rem;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .preview-container {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            background: var(--secondary-bg);
            padding: 0.8rem;
            border-bottom: 1px solid #ccc;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .run-btn {
            background: #27c93f;
            color: #000;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .run-btn:hover {
            opacity: 0.8;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }

        .icon-html { color: #e34f26; }
        .icon-css { color: #264de4; }
        .icon-js { color: #f7df1e; }

    </style>
</head>
<body>
    
    <div class="workspace-header">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;"><span class="gradient-text">NEXUS</span> <span style="font-size: 1rem; color: #94a3b8; font-weight: normal;">Workspace</span></a>
        </div>
        <div>
            <button class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Salvar Projeto</button>
            <button class="btn-primary run-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem; margin-left: 10px;" onclick="runCode()">Executar Código 🚀</button>
        </div>
    </div>

    <div class="workspace-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3 style="font-size: 1rem; color: #cbd5e1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Arquivos</h3>
            <ul class="file-list">
                <li class="file-item active" onclick="switchTab('html')">
                    <span class="icon-html">📄</span> index.html
                </li>
                <li class="file-item" onclick="switchTab('css')">
                    <span class="icon-css">🎨</span> style.css
                </li>
                <li class="file-item" onclick="switchTab('js')">
                    <span class="icon-js">⚡</span> script.js
                </li>
            </ul>
        </div>

        <!-- Code Editor -->
        <div class="editor-container">
            <div class="editor-tabs">
                <div class="tab active" id="tab-html" onclick="switchTab('html')">index.html</div>
                <div class="tab" id="tab-css" onclick="switchTab('css')">style.css</div>
                <div class="tab" id="tab-js" onclick="switchTab('js')">script.js</div>
            </div>
            
            <textarea id="code-html" class="code-area" spellcheck="false" placeholder="<!-- Digite seu HTML aqui -->">
<div class="card">
    <h2>Olá, Nexus!</h2>
    <p>Este é o seu novo ambiente de projetos.</p>
    <button onclick="showAlert()">Clique Aqui</button>
</div></textarea>
            
            <textarea id="code-css" class="code-area" style="display: none;" spellcheck="false" placeholder="/* Digite seu CSS aqui */">
body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f2f5;
}

.card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    text-align: center;
}

button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #4f46e5;
}</textarea>
            
            <textarea id="code-js" class="code-area" style="display: none;" spellcheck="false" placeholder="// Digite seu JavaScript aqui">
function showAlert() {
    alert('Projeto rodando com sucesso no Nexus Workspace!');
}</textarea>
        </div>

        <!-- Live Preview -->
        <div class="preview-container">
            <div class="preview-header">
                <span style="color: #94a3b8; font-size: 0.9rem;">Resultado ao vivo</span>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        function switchTab(type) {
            // Esconde todos os textareas
            document.getElementById('code-html').style.display = 'none';
            document.getElementById('code-css').style.display = 'none';
            document.getElementById('code-js').style.display = 'none';
            
            // Remove a classe active de todas as abas e itens do menu
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.file-item').forEach(f => f.classList.remove('active'));
            
            // Mostra o selecionado
            document.getElementById(`code-${type}`).style.display = 'block';
            document.getElementById(`tab-${type}`).classList.add('active');
            
            // Atualiza sidebar
            const items = document.querySelectorAll('.file-item');
            if(type === 'html') items[0].classList.add('active');
            if(type === 'css') items[1].classList.add('active');
            if(type === 'js') items[2].classList.add('active');
        }

        function runCode() {
            const html = document.getElementById('code-html').value;
            const css = document.getElementById('code-css').value;
            const js = document.getElementById('code-js').value;
            const previewFrame = document.getElementById('preview-frame');

            const content = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>${css}</style>
                </head>
                <body>
                    ${html}
                    <script>${js}<\/script>
                </body>
                </html>
            `;

            const blob = new Blob([content], { type: 'text/html' });
            previewFrame.src = URL.createObjectURL(blob);
        }

        // Run code on initial load
        window.onload = runCode;
        
        // Opcional: Atualizar enquanto digita (descomente se quiser live update real-time)
        // document.querySelectorAll('.code-area').forEach(area => {
        //     area.addEventListener('input', runCode);
        // });
    </script>
</body>
</html>
