<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>NEXUS Dev | Polyglot IDE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1a;--bg2:#13162a;--bg3:#080a14;--panel:#0f1221;--accent:#6366f1;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--text:#e2e8f0;--muted:#4a5568;--border:#1e2640;--web-color:#10b981;--logic-color:#6366f1;--sim-color:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* TOPBAR */
.topbar{background:var(--bg3);border-bottom:1px solid var(--border);padding:.45rem 1rem;display:flex;align-items:center;gap:.5rem;flex-shrink:0;z-index:10}
.logo{font-weight:800;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:.95rem;white-space:nowrap;margin-right:.2rem}
.env-badge{display:flex;align-items:center;gap:.4rem;padding:.25rem .8rem;border-radius:20px;font-size:.78rem;font-weight:700;border:1px solid;transition:.3s;cursor:default}
.env-web{background:rgba(16,185,129,.12);color:var(--web-color);border-color:rgba(16,185,129,.3)}
.env-logic{background:rgba(99,102,241,.12);color:var(--logic-color);border-color:rgba(99,102,241,.3)}
.env-sim{background:rgba(245,158,11,.12);color:var(--sim-color);border-color:rgba(245,158,11,.3)}
#lang-select{font-family:'Outfit',sans-serif;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;outline:none;padding:.3rem .7rem;font-size:.82rem;max-width:200px}
#lang-select:focus{border-color:var(--accent)}
btn,button{font-family:'Outfit',sans-serif;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;outline:none;padding:.3rem .8rem;font-size:.8rem;transition:.2s}
button:hover{border-color:var(--accent);color:var(--accent)}
.btn-run{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;padding:.3rem 1.1rem}
.btn-run:hover{background:#059669;border-color:#059669;color:#fff}
.btn-learn{background:linear-gradient(135deg,#6366f1,#ec4899);border:none;color:#fff;font-weight:700}
.btn-learn:hover{opacity:.9;color:#fff}
.sp{flex:1}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
/* MAIN */
.main{display:flex;flex:1;overflow:hidden}
/* FILE TREE */
.filetree{width:200px;background:var(--bg3);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:.3s;overflow:hidden}
.filetree.collapsed{width:0;border:none}
.ft-head{padding:.5rem .8rem;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ft-head button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0}
.ft-head button:hover{color:var(--text)}
.ft-list{flex:1;overflow-y:auto;padding:.3rem}
.ft-item{display:flex;align-items:center;gap:.4rem;padding:.35rem .5rem;border-radius:5px;cursor:pointer;font-size:.8rem;color:#94a3b8;border:1px solid transparent;transition:.15s;margin-bottom:.1rem}
.ft-item:hover{background:var(--bg2);color:var(--text)}
.ft-item.active{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.3);color:#a5b4fc}
.ft-icon{font-size:.85rem;flex-shrink:0}
.ft-new{width:100%;margin-top:.3rem;background:none;border:1px dashed var(--border);color:var(--muted);border-radius:5px;padding:.3rem;font-size:.75rem;cursor:pointer}
.ft-new:hover{border-color:var(--accent);color:var(--accent)}
/* EDITOR */
.ep{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ehead{padding:.35rem .8rem;background:var(--bg2);border-bottom:1px solid var(--border);font-size:.78rem;display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.ehead .ftab{padding:.15rem .6rem;border-radius:4px;cursor:pointer;color:var(--muted);border:1px solid transparent;font-size:.78rem;transition:.15s}
.ehead .ftab.active{background:var(--bg);color:var(--text);border-color:var(--border)}
.ehead .ftab:hover:not(.active){color:var(--text)}
.ewrap{flex:1;display:flex;overflow:hidden}
.lnum{width:38px;padding:.7rem .3rem;background:var(--panel);text-align:right;font-family:'Fira Code',monospace;color:var(--muted);font-size:12.5px;line-height:1.65;border-right:1px solid var(--border);overflow:hidden;user-select:none;flex-shrink:0}
.editor{flex:1;padding:.7rem .9rem;background:transparent;font-family:'Fira Code',monospace;font-size:13px;line-height:1.65;border:none;outline:none;resize:none;overflow:auto;white-space:pre;caret-color:#6366f1}
/* Editor theme colors per mode */
body.mode-web .editor{color:#86efac}
body.mode-logic .editor{color:#a5b4fc}
body.mode-sim .editor{color:#fcd34d}
/* OUTPUT */
.output{width:44%;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:280px;flex-shrink:0;transition:.3s}
/* WEB: Live Preview pane */
.pv-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pv-bar{padding:.35rem .8rem;background:var(--bg3);border-bottom:1px solid var(--border);font-size:.75rem;color:var(--web-color);display:flex;align-items:center;gap:.5rem;flex-shrink:0}
iframe#pvf{flex:1;border:none;background:#fff}
/* LOGIC: Terminal pane */
.term-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.term-bar{padding:.35rem .8rem;background:#040507;border-bottom:1px solid #0a0b12;font-size:.75rem;color:var(--green);display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.term-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.term-body{flex:1;background:#030408;padding:.7rem;font-family:'Fira Code',monospace;font-size:13px;line-height:1.7;overflow-y:auto;display:flex;flex-direction:column}
.term-output{flex:1;overflow-y:auto}
.tl{margin-bottom:.1rem}.tl.stdout{color:#d4d4d4}.tl.err{color:#f87171}.tl.warn{color:var(--yellow)}.tl.sys{color:#475569}.tl.ok{color:var(--green)}
.term-input-row{display:flex;align-items:center;gap:.3rem;margin-top:.5rem;border-top:1px solid #0d0f1a;padding-top:.5rem}
.term-prompt{color:var(--green);font-size:13px;flex-shrink:0}
#term-in{flex:1;background:transparent;border:none;outline:none;font-family:'Fira Code',monospace;font-size:13px;color:#e2e8f0;caret-color:var(--green)}
/* SIM pane */
.sim-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sim-bar{padding:.35rem .8rem;background:#110c00;border-bottom:1px solid #2a1a00;font-size:.75rem;color:var(--yellow);flex-shrink:0}
.sim-body{flex:1;padding:.8rem;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;background:#0a0700}
.sim-note{font-size:.76rem;color:var(--yellow);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:6px;padding:.5rem .7rem}
.sim-label{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.25rem}
.sim-code{font-family:'Fira Code',monospace;font-size:12.5px;color:#fcd34d;white-space:pre-wrap;background:rgba(0,0,0,.4);padding:.7rem;border-radius:6px;border:1px solid #2a1a00;max-height:200px;overflow-y:auto}
.sim-out{background:#041008;border:1px solid rgba(16,185,129,.25);border-radius:6px;padding:.7rem;font-family:'Fira Code',monospace;font-size:13px;color:var(--green);white-space:pre-wrap}
/* Error badge */
.ebadge{background:var(--red);color:#fff;border-radius:10px;padding:0 5px;font-size:.7rem;display:none}
.ebadge.on{display:inline}
/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>
</head>
<body class="mode-web">
<!-- TOPBAR -->
<div class="topbar">
  <a href="workspace.html" style="text-decoration:none;color:var(--muted);font-size:1rem" title="Hub">⬅</a>
  <span class="logo">NEXUS Dev</span>
  <div class="sep"></div>
  <select id="lang-select" onchange="changeLang()"></select>
  <div class="env-badge env-web" id="env-badge">🌐 WEB</div>
  <div class="sep"></div>
  <button onclick="fmtCode()">✨ Formatar</button>
  <button onclick="toggleFT()">📁 Arquivos</button>
  <div class="sp"></div>
  <a href="learn-workspace.html" style="text-decoration:none"><button class="btn-learn">🎓 Aprender</button></a>
  <span class="ebadge" id="ebadge">0 erros</span>
  <button class="btn-run" onclick="runCode()" title="Ctrl+Enter">▶ Executar</button>
</div>
<!-- MAIN -->
<div class="main">
  <!-- FILE TREE -->
  <div class="filetree" id="ft">
    <div class="ft-head">
      <span>Arquivos</span>
      <button onclick="addFile()">＋</button>
    </div>
    <div class="ft-list" id="ftlist"></div>
  </div>
  <!-- EDITOR -->
  <div class="ep">
    <div class="ehead" id="etabs"></div>
    <div class="ewrap">
      <div class="lnum" id="lnum">1</div>
      <textarea class="editor" id="ed" spellcheck="false"
        oninput="onInput()" onkeydown="edKey(event)" onscroll="syncLN()"></textarea>
    </div>
  </div>
  <!-- OUTPUT -->
  <div class="output" id="output">
    <!-- WEB: Live Preview -->
    <div class="pv-pane" id="pv-pane">
      <div class="pv-bar">🌐 Live Preview — Interativo</div>
      <iframe id="pvf" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
    </div>
    <!-- LOGIC: Terminal -->
    <div class="term-pane" id="term-pane" style="display:none">
      <div class="term-bar"><div class="term-dot"></div>Terminal — Execução Real</div>
      <div class="term-body">
        <div class="term-output" id="tout"></div>
        <div class="term-input-row">
          <span class="term-prompt">nexus@sandbox:~$</span>
          <input id="term-in" placeholder="..." onkeydown="termKey(event)">
        </div>
      </div>
    </div>
    <!-- SIM -->
    <div class="sim-pane" id="sim-pane" style="display:none">
      <div class="sim-bar">⚡ Modo Simulação — Linguagem Server-Side</div>
      <div class="sim-body">
        <div class="sim-note">Esta linguagem requer compilador/servidor. Exibindo saída simulada baseada no template.</div>
        <div><div class="sim-label">Seu Código</div><div class="sim-code" id="sc"></div></div>
        <div><div class="sim-label">Saída Esperada</div><div class="sim-out" id="so"></div></div>
      </div>
    </div>
  </div>
</div>
<script src="languages-data.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────
const ed   = document.getElementById('ed');
const lnum = document.getElementById('lnum');
const tout = document.getElementById('tout');
let curLang = 'html-js';
let mode    = 'web'; // 'web' | 'logic' | 'sim'
let ecnt    = 0;

// Multi-file system
const files = {};   // name → {lang,content}
let   curFile = 'index.html';

// ── WEB LANG TYPES ─────────────────────────────────────────────
const WEB_RUNNERS   = ['web','babel-react','babel-ts','vue','tailwind','coffeescript'];
const LOGIC_RUNNERS = ['brython','opal','fengari','alasql','piston','delphi-compiler','abap-compiler','apex-compiler','scheme-compiler'];
const SIM_RUNNER    = 'sim';

function getMode(runner){
  if(WEB_RUNNERS.includes(runner)) return 'web';
  if(LOGIC_RUNNERS.includes(runner)||runner==='alasql') return 'logic';
  return 'sim';
}

// ── BUILD SELECT ───────────────────────────────────────────────
(function(){
  const sel = document.getElementById('lang-select');
  const groups = {
    'Web / Frontend':   ['html-js','react','vue','tailwind','typescript','coffeescript','elm','dart'],
    'Scripting':        ['python','ruby','lua','perl','groovy','tcl','awk','bash','powershell'],
    'Sistemas':         ['c','cpp','go','rust','zig','nim','d','carbon','ada','pascal','fortran','cobol','assembly'],
    'JVM':              ['java','kotlin','scala','clojure'],
    '.NET':             ['csharp','fsharp','vbnet'],
    'PHP':              ['php'],
    'Mobile':           ['swift','objc'],
    'Funcionais':       ['haskell','erlang','elixir','lisp','scheme','prolog','ocaml','sml'],
    'Dados / IA':       ['r','julia','matlab','sql','sas'],
    'Legado / Outros':  ['delphi','abap','apex','vhdl','verilog']
  };
  for(const [g,keys] of Object.entries(groups)){
    const og = document.createElement('optgroup');
    og.label = g;
    keys.forEach(k=>{
      if(!LANGS[k]) return;
      const o = document.createElement('option');
      o.value = k; o.textContent = LANGS[k].name;
      og.appendChild(o);
    });
    sel.appendChild(og);
  }
})();

// ── CHANGE LANGUAGE ────────────────────────────────────────────
function changeLang(){
  curLang = document.getElementById('lang-select').value;
  const L = LANGS[curLang]; if(!L) return;
  mode = getMode(L.runner);

  // Reset file tree for new lang
  const fname = 'main.'+L.ext;
  files[fname] = { lang: curLang, content: L.template };
  switchFile(fname);
  renderFT();
  updateEnvBadge();
  updateOutput();
  runCode();
}

function updateEnvBadge(){
  const b = document.getElementById('env-badge');
  b.className = 'env-badge';
  if(mode==='web'){   b.classList.add('env-web');   b.textContent='🌐 WEB'; }
  else if(mode==='logic'){ b.classList.add('env-logic'); b.textContent='⬛ LÓGICA'; }
  else{               b.classList.add('env-sim');   b.textContent='⚡ SIMULAÇÃO'; }

  document.body.className = 'mode-'+mode;
}

function updateOutput(){
  document.getElementById('pv-pane').style.display   = mode==='web'   ? 'flex':'none';
  document.getElementById('term-pane').style.display = mode==='logic' ? 'flex':'none';
  document.getElementById('sim-pane').style.display  = mode==='sim'   ? 'flex':'none';
}

// ── FILE TREE ──────────────────────────────────────────────────
function renderFT(){
  const list = document.getElementById('ftlist');
  list.innerHTML='';
  const tabs = document.getElementById('etabs');
  tabs.innerHTML='';
  Object.keys(files).forEach(name=>{
    const ext = name.split('.').pop();
    const icons = {html:'🌐',js:'⚡',css:'🎨',ts:'💙',py:'🐍',rb:'💎',lua:'🌙',java:'☕',c:'⚙',cpp:'⚙',go:'🐹',rs:'🦀',sql:'🗄',sh:'📟',default:'📄'};
    const icon = icons[ext]||icons.default;
    const li = document.createElement('div');
    li.className = 'ft-item'+(name===curFile?' active':'');
    li.innerHTML=`<span class="ft-icon">${icon}</span>${name}`;
    li.onclick = ()=>switchFile(name);
    list.appendChild(li);
    // Tab
    const tab = document.createElement('div');
    tab.className = 'ftab'+(name===curFile?' active':'');
    tab.textContent = name;
    tab.onclick = ()=>switchFile(name);
    tabs.appendChild(tab);
  });
  const nb = document.createElement('button');
  nb.className='ft-new'; nb.textContent='+ Novo Arquivo'; nb.onclick=addFile;
  list.appendChild(nb);
}

function switchFile(name){
  if(curFile && files[curFile]) files[curFile].content=ed.value;
  curFile = name;
  if(files[name]){ ed.value=files[name].content; }
  updateLN(); renderFT();
}

function addFile(){
  const name = prompt('Nome do arquivo (ex: utils.js):');
  if(!name||files[name]) return;
  files[name]={lang:curLang,content:''};
  switchFile(name); renderFT();
}

function toggleFT(){
  document.getElementById('ft').classList.toggle('collapsed');
}

// ── EDITOR ─────────────────────────────────────────────────────
function updateLN(){
  const n = ed.value.split('\n').length;
  lnum.innerHTML = Array.from({length:n},(_,i)=>i+1).join('<br>');
}
function syncLN(){ lnum.scrollTop=ed.scrollTop; }
function onInput(){ updateLN(); if(files[curFile]) files[curFile].content=ed.value; }
function edKey(e){
  if(e.ctrlKey&&e.key==='Enter'){ e.preventDefault(); runCode(); return; }
  if(e.key==='Tab'){ e.preventDefault(); const s=ed.selectionStart,v=ed.value; ed.value=v.slice(0,s)+'  '+v.slice(ed.selectionEnd); ed.selectionStart=ed.selectionEnd=s+2; }
}

function fmtCode(){
  if(['html-js','react','vue','tailwind'].includes(curLang)){
    ed.value = ed.value.replace(/></g,'>\n<');
  }
  updateLN();
}

// ── TERMINAL HELPERS ───────────────────────────────────────────
function tPrint(text,cls='stdout'){
  const d=document.createElement('div');
  d.className='tl '+cls;
  d.textContent=text;
  tout.appendChild(d);
  tout.scrollTop=tout.scrollHeight;
}
function tClear(){ tout.innerHTML=''; }
function termKey(e){
  if(e.key==='Enter'){
    const v = document.getElementById('term-in').value;
    document.getElementById('term-in').value='';
    tPrint('$ '+v,'sys');
  }
}

// ── ERRORS ─────────────────────────────────────────────────────
function clearErrs(){ ecnt=0; document.getElementById('ebadge').classList.remove('on'); }
function addErr(msg){
  ecnt++;
  const b=document.getElementById('ebadge');
  b.textContent=ecnt+' erro'+(ecnt>1?'s':'');
  b.classList.add('on');
  tPrint('✗ ERRO: '+msg,'err');
}

// ── EXECUTION ENGINE ───────────────────────────────────────────
async function runPiston(L, code) {
  const pMap = { 
    'assembly': 'nasm', 
    'vbnet': 'basic.net', 
    'csharp': 'csharp.net', 
    'fsharp': 'fsharp.net', 
    'r': 'rscript' 
  };
  const versionsMap = {
    'c': '10.2.0', 'cpp': '10.2.0', 'java': '15.0.2', 'csharp': '5.0.201',
    'go': '1.16.2', 'rust': '1.68.2', 'kotlin': '1.8.20', 'swift': '5.3.3',
    'php': '8.2.3', 'scala': '3.2.2', 'assembly': '2.15.5', 'zig': '0.10.1',
    'nim': '1.6.2', 'd': '10.2.0', 'pascal': '3.2.2', 'fortran': '10.2.0',
    'cobol': '3.1.2', 'r': '4.1.1', 'julia': '1.8.5', 'haskell': '9.0.1',
    'erlang': '23.0.0', 'elixir': '1.11.3', 'clojure': '1.10.3', 'fsharp': '5.0.201',
    'lisp': '2.1.2', 'prolog': '8.2.4', 'ocaml': '4.12.0', 'bash': '5.2.0',
    'powershell': '7.1.4', 'perl': '5.36.0', 'groovy': '3.0.7', 'awk': '5.1.0',
    'dart': '2.19.6', 'vbnet': '5.0.201'
  };

  const pLang = pMap[curLang] || curLang;
  const pVersion = versionsMap[curLang] || "*";
  
  try {
    let filename = 'main.' + L.ext;
    if (curLang === 'java') filename = 'Main.java';

    const res = await fetch('https://emkc.org/api/v2/piston/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        language: pLang,
        version: pVersion,
        files: [{ name: filename, content: code }]
      })
    });
    const data = await res.json();
    if(data.message) {
      tPrint('⚠ Esta linguagem não possui compilador remoto.', 'warn');
      tPrint('--- SAÍDA SIMULADA ---', 'sys');
      tPrint(L.simOut || 'Sem simulação.', 'stdout');
      return;
    }
    if(data.compile && data.compile.stderr) tPrint('✗ COMPILAÇÃO:\n' + data.compile.stderr, 'err');
    if(data.run) {
      if(data.run.stdout) tPrint(data.run.stdout, 'stdout');
      if(data.run.stderr) tPrint(data.run.stderr, 'err');
      if(data.run.code !== 0) tPrint('Finalizado (código ' + data.run.code + ')', 'warn');
      else tPrint('Execução finalizada.', 'ok');
    }
  } catch(e) {
    tPrint('✗ Falha na conexão com o contêiner de compilação.', 'err');
  }
}

function runCode(){
  const L = LANGS[curLang]; if(!L) return;
  const code = ed.value;
  clearErrs();
  updateOutput();

  if(mode==='sim'){
    document.getElementById('sc').textContent = code;
    document.getElementById('so').textContent = L.simOut||'(sem saída simulada)';
    return;
  }

  if(mode==='logic'){
    tClear();
    tPrint('Executando '+L.name+'...','sys');
  }

  if(L.runner === 'piston') {
    runPiston(L, code);
    return;
  }

  const cdnList = L.cdn||RUNNER_CDN[L.runner]||[];
  const headCDN = cdnList.map(u=>`<script src="${u}"><\/script>`).join('\n');

  const interceptor = `<script>
const P=window.parent;
['log','warn','error','info'].forEach(m=>{
  const o=console[m];
  console[m]=function(...a){P.postMessage({t:'con',m,a:a.map(String)},'*');o.apply(console,a);};
});
window.onerror=function(msg,s,l,c,e){P.postMessage({t:'err',msg,l},'*');return false;};
<\/script>`;

  let body='<body>',content=code;
  const r=L.runner;

  if(r==='babel-react'){
    if(!code.includes('type="text/babel"'))
      content=`<div id="root"></div><script type="text/babel">\n${code}\n<\/script>`;
  } else if(r==='babel-ts'){
    if(!code.includes('type="text/babel"'))
      content=`<script type="text/babel" data-presets="typescript">\n${code}\n<\/script>`;
  } else if(r==='vue'){
    // wrap if needed
  } else if(r==='brython'){
    body='<body onload="brython()">';
    content=`<script type="text/python">
from browser import console as _c
import sys
class _R:
    def write(self,d):
        if d.strip(): _c.log(d)
    def flush(self):pass
sys.stdout=_R();sys.stderr=_R()
${code}
<\/script>`;
  } else if(r==='opal'){
    content=`<script>Opal.load('opal');Opal.load('opal-parser');Opal.eval(\`${code.replace(/`/g,'\\`')}\`);<\/script>`;
  } else if(r==='fengari'){
    content=`<script type="application/lua">${code}<\/script>`;
  } else if(r==='coffeescript'){
    content=`<script>eval(CoffeeScript.compile(\`${code.replace(/`/g,'\\`')}\`));<\/script>`;
  } else if(r==='alasql'){
    const safe=code.replace(/`/g,'\\`');
    content=`<script>var ss=\`${safe}\`.split(';').map(s=>s.trim()).filter(s=>s&&!s.startsWith('--'));
ss.forEach(s=>{try{var r=alasql(s+';');if(Array.isArray(r)&&r.length)console.log(JSON.stringify(r,null,2));}catch(e){console.error(e.message);}});<\/script>`;
  } else if(r==='scheme-compiler'){
    content=`<script>
var biwa = new BiwaScheme.Interpreter(function(e){ console.error(e.message); });
biwa.evaluate(\`${code.replace(/`/g,'\\`')}\`);
<\/script>`;
  } else if(r==='delphi-compiler'){
    content=`<script>
let jsCode = \`${code.replace(/`/g,'\\`')}\`
  .replace(/program\\s+\\w+;/gi, '')
  .replace(/var\\s+[\\w\\s,:]+;/gi, '')
  .replace(/begin/gi, '{')
  .replace(/end\\./gi, '}')
  .replace(/Writeln\\((.*?)\\);/gi, 'console.log($1);')
  .replace(/Write\\((.*?)\\);/gi, 'console.log($1);')
  .replace(/for\\s+(\\w+)\\s*:=\\s*(\\d+)\\s+to\\s+(\\d+)\\s+do/gi, 'for(let $1=$2; $1<=$3; $1++)')
  .replace(/\\'/g, '"');
try { eval(jsCode); } catch(e) { console.error('Erro Delphi: ' + e.message); }
<\/script>`;
  } else if(r==='abap-compiler'){
    content=`<script>
let jsCode = \`${code.replace(/`/g,'\\`')}\`
  .replace(/REPORT\\s+\\w+\\./gi, '')
  .replace(/DATA:\\s+(\\w+)\\s+TYPE\\s+\\w+\\./gi, 'let $1 = "";')
  .replace(/(\\w+)\\s*=\\s*'(.*?)'\\./gi, '$1 = "$2";')
  .replace(/WRITE:\\s*'(.*?)'\\./gi, 'console.log("$1");')
  .replace(/WRITE:\\s*'(.*?)',\\s*(\\w+)\\./gi, 'console.log("$1 " + $2);')
  .replace(/NEW-LINE\\./gi, '');
try { eval(jsCode); } catch(e) { console.error('Erro ABAP: ' + e.message); }
<\/script>`;
  } else if(r==='apex-compiler'){
    content=`<script>
let jsCode = \`${code.replace(/`/g,'\\`')}\`
  .replace(/public\\s+class\\s+\\w+\\s*\\{/gi, '{')
  .replace(/public\\s+static\\s+void\\s+main\\(\\)\\s*\\{/gi, '{')
  .replace(/System\\.debug\\((.*?)\\);/gi, 'console.log($1);')
  .replace(/String\\s+(\\w+)/gi, 'let $1');
try { eval(jsCode); } catch(e) { console.error('Erro Apex: ' + e.message); }
<\/script>`;
  }

  // Combine all files for web builds
  let extraCSS='',extraJS='';
  if(mode==='web'){
    Object.entries(files).forEach(([n,f])=>{
      if(n===curFile)return;
      if(n.endsWith('.css')) extraCSS+=f.content+'\n';
      if(n.endsWith('.js'))  extraJS+=f.content+'\n';
    });
  }

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">${headCDN}<style>${extraCSS}</style>${interceptor}</head>${body}${content}<script>${extraJS}<\/script></body></html>`;

  if(mode==='web'){
    document.getElementById('pvf').src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  } else {
    const f=document.getElementById('pvf');
    f.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  }

  window.onmessage=e=>{
    const d=e.data;
    if(d.t==='con'){
      if(mode==='logic'){ tPrint(d.a.join(' '), d.m==='error'?'err':d.m==='warn'?'warn':'stdout'); }
      if(d.m==='error') addErr(d.a.join(' '));
    } else if(d.t==='err'){
      addErr(d.msg+' (linha '+d.l+')');
      if(mode==='logic') tPrint('✗ '+d.msg,'err');
    }
  };
}

// ── INIT ───────────────────────────────────────────────────────
(function(){
  const L=LANGS[curLang];
  files['index.html']={lang:'html-js',content:L.template};
  switchFile('index.html');
  renderFT();
  updateEnvBadge();
  updateOutput();
  runCode();
})();
</script>
