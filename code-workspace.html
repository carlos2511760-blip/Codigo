<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS Dev | Polyglot Sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f111a;--bg2:#1a1d2d;--bg3:#0a0b12;--accent:#6366f1;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--text:#f1f5f9;--muted:#64748b;--border:#1e2640}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg3);border-bottom:1px solid var(--border);padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.logo{font-weight:800;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;font-size:1rem}
select,button{font-family:'Outfit',sans-serif;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;outline:none;padding:.3rem .7rem;font-size:.82rem}
select:hover,button:hover{border-color:var(--accent)}
#lang-select{width:210px}
.btn-run{background:var(--green);border-color:var(--green);font-weight:700;color:#fff}
.btn-run:hover{background:#059669}
.btn-learn{background:linear-gradient(135deg,#6366f1,#ec4899);border:none;color:#fff;font-weight:700}
.sp{flex:1}
.main{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:230px;background:var(--bg3);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:.3s}
.sidebar.hidden{width:0;overflow:hidden;border:none}
.sh{padding:.7rem 1rem;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sh button{background:none;border:none;color:var(--muted);cursor:pointer}
.hlist{flex:1;overflow-y:auto;padding:.4rem}
.hitem{padding:.5rem .7rem;border-radius:6px;background:var(--bg2);margin-bottom:.3rem;cursor:pointer;border:1px solid transparent;font-size:.8rem;transition:.2s}
.hitem:hover{border-color:var(--accent)}
.htime{font-size:.7rem;color:var(--muted)}
/* Editor */
.ep{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
.ehead{padding:.4rem 1rem;background:var(--bg2);border-bottom:1px solid var(--border);font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ewrap{flex:1;display:flex;overflow:hidden}
.lnum{width:42px;padding:.8rem .4rem;background:var(--bg2);text-align:right;font-family:'Fira Code',monospace;color:var(--border);font-size:13px;line-height:1.6;border-right:1px solid var(--border);overflow:hidden;user-select:none;flex-shrink:0}
.editor{flex:1;padding:.8rem;background:transparent;color:#a5b4fc;font-family:'Fira Code',monospace;font-size:13px;line-height:1.6;border:none;outline:none;resize:none;white-space:pre;overflow:auto}
/* Output */
.op{width:46%;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.otabs{background:var(--bg3);border-bottom:1px solid var(--border);display:flex}
.otab{padding:.5rem 1rem;font-size:.82rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.otab.active{color:var(--text);border-color:var(--accent)}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 5px;font-size:.7rem;margin-left:.3rem;display:none}
.badge.on{display:inline}
.oview{flex:1;display:none;overflow:auto}
.oview.active{display:flex;flex-direction:column}
iframe#pv{width:100%;height:100%;border:none;background:#fff}
.cv{flex:1;padding:.8rem;font-family:'Fira Code',monospace;font-size:12.5px;line-height:1.7;background:#0d1117;overflow-y:auto}
.cl{padding:.15rem 0;border-bottom:1px solid rgba(255,255,255,.04)}.cl.log{color:#d4d4d4}.cl.warn{color:var(--yellow)}.cl.err{color:#f87171}.cl.info{color:#60a5fa}
.erv{padding:1rem;background:#1a0a0a;overflow-y:auto}
.erc{background:#1a0505;border-left:3px solid var(--red);border-radius:4px;padding:.8rem;margin-bottom:.8rem}
.erc h4{color:var(--red);font-size:.85rem;margin-bottom:.4rem;font-family:'Fira Code',monospace}
.erc p{color:#fca5a5;font-size:.8rem;margin-bottom:.5rem}
.erc button{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:.3rem .7rem;font-size:.78rem;cursor:pointer}
/* SIM view */
.sv{flex:1;display:flex;flex-direction:column;background:#0d1117;overflow:hidden}
.sv-top{flex:1;overflow-y:auto;padding:1rem}
.sv-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.4rem}
.sv-code{font-family:'Fira Code',monospace;font-size:12.5px;color:#a5b4fc;white-space:pre-wrap;background:rgba(0,0,0,.3);padding:.8rem;border-radius:6px;border:1px solid var(--border)}
.sv-out{background:#071a0e;border:1px solid var(--green);border-radius:6px;padding:.8rem;font-family:'Fira Code',monospace;font-size:12.5px;color:var(--green);white-space:pre-wrap;margin-top:1rem}
.sim-note{font-size:.78rem;color:var(--yellow);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:6px;padding:.6rem;margin-bottom:1rem}
/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="topbar">
  <a href="workspace.html" style="text-decoration:none;color:var(--accent);font-size:1.1rem" title="Hub">⬅</a>
  <span class="logo">NEXUS Dev</span>
  <select id="lang-select" onchange="changeLang()"></select>
  <button onclick="formatCode()">✨ Formatar</button>
  <button onclick="toggleHistory()">📋 Histórico</button>
  <div class="sp"></div>
  <a href="learn-workspace.html"><button class="btn-learn">🎓 Aprender</button></a>
  <button class="btn-run" onclick="runCode()">▶ Executar</button>
</div>
<div class="main">
  <div class="sidebar hidden" id="hist-panel">
    <div class="sh"><span>Histórico</span><button onclick="toggleHistory()">✕</button></div>
    <div class="hlist" id="hlist"></div>
  </div>
  <div class="ep">
    <div class="ehead"><span id="flabel">main.html</span><span style="color:var(--green);font-size:.78rem">● Pronto</span></div>
    <div class="ewrap">
      <div class="lnum" id="lnum">1</div>
      <textarea class="editor" id="ed" spellcheck="false" oninput="onInput()" onkeydown="edKey(event)" onscroll="syncLN()"></textarea>
    </div>
  </div>
  <div class="op">
    <div class="otabs">
      <div class="otab active" id="t-pv" onclick="showTab('pv')">🖥 Preview</div>
      <div class="otab" id="t-cv" onclick="showTab('cv')">⬛ Console</div>
      <div class="otab" id="t-er" onclick="showTab('er')">⚠ Erros <span class="badge" id="eb">0</span></div>
      <div class="otab" id="t-sv" onclick="showTab('sv')">💻 Simulação</div>
    </div>
    <div class="oview active" id="pv"><iframe id="pvf" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe></div>
    <div class="oview" id="cv"><div class="cv" id="clog"></div></div>
    <div class="oview" id="er"><div class="erv" id="erlist"><p style="color:var(--muted);text-align:center;margin-top:2rem">Nenhum erro</p></div></div>
    <div class="oview" id="sv">
      <div class="sv">
        <div class="sv-top">
          <div class="sim-note">⚡ Modo Simulação — Esta linguagem executa no servidor. Saída baseada no código de exemplo.</div>
          <div class="sv-label">Código</div>
          <div class="sv-code" id="sc"></div>
          <div class="sv-label" style="margin-top:1rem">Saída Esperada</div>
          <div class="sv-out" id="so"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="languages-data.js"></script>
<script>
const ed=document.getElementById('ed');
const lnum=document.getElementById('lnum');
const clog=document.getElementById('clog');
const erlist=document.getElementById('erlist');
const eb=document.getElementById('eb');
let vhist=[],htimer=null,ecnt=0,curLang='html-js';

/* Build select */
(function(){
  const sel=document.getElementById('lang-select');
  const groups={
    'Web/Frontend':['html-js','react','vue','tailwind','typescript','coffeescript','elm','dart'],
    'Scripting':['python','ruby','lua','perl','groovy','tcl','awk','bash','powershell'],
    'Sistemas':['c','cpp','go','rust','zig','nim','d','carbon','ada','pascal','fortran','cobol','assembly'],
    'JVM / Geral':['java','kotlin','scala','clojure'],
    '.NET':['csharp','fsharp','vbnet'],
    'PHP':['php'],
    'Swift / Mobile':['swift','objc','dart'],
    'Funcionais':['haskell','erlang','elixir','lisp','scheme','prolog','ocaml','sml'],
    'Dados / IA':['r','julia','matlab','sql','sas'],
    'Legado / Outros':['delphi','abap','apex','vhdl','verilog']
  };
  for(const[g,keys] of Object.entries(groups)){
    const og=document.createElement('optgroup');
    og.label=g;
    keys.forEach(k=>{
      if(!LANGS[k])return;
      const o=document.createElement('option');
      o.value=k;o.textContent=LANGS[k].name;
      og.appendChild(o);
    });
    sel.appendChild(og);
  }
})();

function changeLang(){
  curLang=document.getElementById('lang-select').value;
  const L=LANGS[curLang];
  if(!L)return;
  ed.value=L.template;
  document.getElementById('flabel').textContent='main.'+L.ext;
  updateLN();
  runCode();
}

function updateLN(){
  const n=ed.value.split('\n').length;
  lnum.innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>');
}
function syncLN(){lnum.scrollTop=ed.scrollTop;}
function onInput(){updateLN();clearTimeout(htimer);htimer=setTimeout(()=>saveHist(ed.value),2000);}
function edKey(e){
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();runCode();}
  if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart,v=ed.value;ed.value=v.slice(0,s)+'  '+v.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+2;}
}
function saveHist(code){
  if(vhist.length>0&&vhist[vhist.length-1].c===code)return;
  const t=new Date();
  vhist.push({c:code,t:`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`});
  renderHist();
}
function renderHist(){
  const l=document.getElementById('hlist');l.innerHTML='';
  vhist.slice().reverse().forEach((h,i)=>{
    const d=document.createElement('div');d.className='hitem';
    d.innerHTML=`<div>v${vhist.length-i}</div><div class="htime">${h.t}</div>`;
    d.onclick=()=>{ed.value=h.c;updateLN();runCode();};
    l.appendChild(d);
  });
}
function toggleHistory(){document.getElementById('hist-panel').classList.toggle('hidden');}
function showTab(id){
  document.querySelectorAll('.otab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.oview').forEach(v=>v.classList.remove('active'));
  document.getElementById('t-'+id).classList.add('active');
  document.getElementById(id).classList.add('active');
}
function formatCode(){
  let c=ed.value;
  const L=LANGS[curLang];
  if(!L)return;
  if(['html-js','react','vue','tailwind','elm'].includes(curLang)){
    c=c.replace(/></g,'>\n<');
  }
  ed.value=c;updateLN();
}
function fixErr(msg){
  if(msg.includes('is not defined'))ed.value='// Correção: variável declarada\nlet missingVar;\n'+ed.value;
  else alert('Verifique a sintaxe: '+msg);
  updateLN();runCode();
}

/* === EXECUTION ENGINE === */
function runCode(){
  const L=LANGS[curLang];
  if(!L){alert('Linguagem não encontrada');return;}
  const code=ed.value;
  clog.innerHTML='';ecnt=0;eb.textContent='0';eb.classList.remove('on');
  erlist.innerHTML='<p style="color:var(--muted);text-align:center;margin-top:2rem">Nenhum erro</p>';
  saveHist(code);

  if(L.runner==='sim'){
    document.getElementById('sc').textContent=code;
    document.getElementById('so').textContent=L.simOut||'// Saída não disponível para este template';
    showTab('sv');return;
  }
  showTab('pv');
  buildIframe(L,code);
}

function buildIframe(L,code){
  const runner=L.runner;
  const cdnList=L.cdn||RUNNER_CDN[runner]||[];
  const headCDN=cdnList.map(u=>`<script src="${u}"><\/script>`).join('\n');

  const interceptor=`<script>
    const P=window.parent;
    ['log','warn','error','info'].forEach(m=>{
      const o=console[m];
      console[m]=function(...a){P.postMessage({t:'con',m,a:a.map(String)},'*');o.apply(console,a);};
    });
    window.onerror=function(msg,s,l){P.postMessage({t:'err',msg,l},'*');return false;};
  <\/script>`;

  let body='<body>';
  let content=code;

  if(runner==='babel-react'){
    body='<body>';
    if(!code.includes('type="text/babel"'))
      content=`<div id="root"></div><script type="text/babel">\n${code}\n<\/script>`;
  } else if(runner==='babel-ts'){
    if(!code.includes('type="text/babel"'))
      content=`<script type="text/babel" data-presets="typescript">\n${code}\n<\/script>`;
  } else if(runner==='brython'){
    body='<body onload="brython()">';
    content=`<script type="text/python">
from browser import console
import sys
class R:
    def write(self,d):
        if d.strip(): console.log(d)
    def flush(self): pass
sys.stdout=R(); sys.stderr=R()
${code}
<\/script>`;
  } else if(runner==='opal'){
    content=`<script>
Opal.load('opal');Opal.load('opal-parser');
Opal.eval(\`${code.replace(/`/g,'\\`')}\`);
<\/script>`;
  } else if(runner==='fengari'){
    content=`<script type="application/lua">\n${code}\n<\/script>`;
  } else if(runner==='coffeescript'){
    content=`<script>
var js=CoffeeScript.compile(\`${code.replace(/`/g,'\\`')}\`);
eval(js);
<\/script>`;
  } else if(runner==='alasql'){
    const safe=code.replace(/`/g,'\\`').replace(/\\/g,'\\\\');
    content=`<script>
var stmts=\`${safe}\`.split(';').map(s=>s.trim()).filter(s=>s&&!s.startsWith('--'));
stmts.forEach(s=>{try{var r=alasql(s+';');if(Array.isArray(r)&&r.length)console.log(JSON.stringify(r,null,2));}catch(e){console.error(e.message);}});
<\/script>`;
  }

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">${headCDN}${interceptor}</head>${body}${content}</body></html>`;
  const pvf=document.getElementById('pvf');
  pvf.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));

  window.onmessage=e=>{
    const d=e.data;
    if(d.t==='con'){
      const div=document.createElement('div');
      div.className='cl '+d.m;
      div.textContent='> '+d.a.join(' ');
      clog.appendChild(div);
      if(d.m==='error')addErr(d.a.join(' '),'N/A');
    } else if(d.t==='err'){addErr(d.msg,d.l);}
  };
}

function addErr(msg,line){
  if(ecnt===0)erlist.innerHTML='';
  ecnt++;eb.textContent=ecnt;eb.classList.add('on');
  const c=document.createElement('div');c.className='erc';
  c.innerHTML=`<h4>Erro (linha ${line})</h4><p>${msg}</p><button onclick="fixErr('${msg.replace(/'/g,"\\'")}')" >🔧 Correção Auto</button>`;
  erlist.appendChild(c);
  if(ecnt===1)showTab('er');
}

/* Init */
changeLang();
</script>
</body>
</html>
