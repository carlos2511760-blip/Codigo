<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenvolvimento | Nexus Workspace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        body { margin: 0; padding: 0; overflow: hidden; background: #0f111a; color: white; font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        
        /* Header */
        .header { background: #050505; border-bottom: 1px solid #1f2937; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .header-left a { text-decoration: none; font-size: 1.2rem; }
        .btn-run { background: #10b981; color: white; border: none; padding: 0.4rem 1rem; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-run:hover { background: #059669; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 220px; background: #050505; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
        .sidebar-title { font-size: 0.8rem; color: #9ca3af; padding: 1rem; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 1.2rem; }
        .btn-add:hover { color: white; }
        
        .file-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .file-item { padding: 0.5rem 1rem; cursor: pointer; color: #d1d5db; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .file-item:hover, .file-item.active { background: #1f2937; color: white; }
        
        /* Language Selector Modal */
        .lang-modal { display: none; position: absolute; top: 110px; left: 200px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 1rem; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .lang-modal select, .lang-modal input { width: 100%; margin-bottom: 1rem; padding: 0.5rem; background: #0f111a; border: 1px solid #374151; color: white; border-radius: 4px; font-family: inherit; }
        .lang-modal button { width: 100%; background: #6366f1; color: white; border: none; padding: 0.5rem; border-radius: 4px; cursor: pointer; }
        
        /* Editor */
        .editor-area { flex: 1; display: flex; flex-direction: column; background: #0f111a; border-right: 1px solid #1f2937; }
        .tabs { display: flex; background: #050505; border-bottom: 1px solid #1f2937; overflow-x: auto; }
        .tab { padding: 0.6rem 1.2rem; color: #9ca3af; cursor: pointer; border-right: 1px solid #1f2937; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .tab.active { background: #0f111a; color: white; border-top: 2px solid #6366f1; }
        
        .code-input { flex: 1; background: transparent; color: #a5b4fc; font-family: 'Fira Code', monospace; font-size: 14px; padding: 1rem; border: none; resize: none; outline: none; line-height: 1.6; }

        /* Preview */
        .preview-area { flex: 1; display: flex; flex-direction: column; background: white; }
        .preview-header { background: #f3f4f6; color: #374151; padding: 0.6rem 1rem; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; font-weight: bold; }
        iframe { flex: 1; width: 100%; border: none; }

        .icon-html { color: #e34f26; }
        .icon-css { color: #264de4; }
        .icon-js { color: #f7df1e; }
        .icon-py { color: #3776ab; }
        .icon-other { color: #9ca3af; }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <a href="workspace.html"><span class="gradient-text">NEXUS</span> <span style="color: #6b7280; font-size: 0.9rem;">/ Code Workspace</span></a>
        </div>
        <div>
            <button class="btn-run" onclick="runCode()">Executar Web 🚀</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-title">
                Arquivos
                <button class="btn-add" onclick="toggleModal()">+</button>
            </div>
            
            <ul class="file-list" id="file-list">
                <li class="file-item active" onclick="switchFile('index.html')"><span class="icon-html">📄</span> index.html</li>
                <li class="file-item" onclick="switchFile('style.css')"><span class="icon-css">🎨</span> style.css</li>
                <li class="file-item" onclick="switchFile('script.js')"><span class="icon-js">⚡</span> script.js</li>
            </ul>
        </div>

        <div class="editor-area">
            <div class="tabs" id="tabs">
                <div class="tab active" id="tab-index.html" onclick="switchFile('index.html')"><span class="icon-html">📄</span> index.html</div>
                <div class="tab" id="tab-style.css" onclick="switchFile('style.css')"><span class="icon-css">🎨</span> style.css</div>
                <div class="tab" id="tab-script.js" onclick="switchFile('script.js')"><span class="icon-js">⚡</span> script.js</div>
            </div>
            <textarea id="code-editor" class="code-input" spellcheck="false"></textarea>
        </div>

        <div class="preview-area">
            <div class="preview-header">Resultado ao Vivo</div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <!-- Modal para Nova Linguagem -->
    <div class="lang-modal" id="lang-modal">
        <h4 style="margin: 0 0 1rem 0;">Novo Arquivo</h4>
        <input type="text" id="new-filename" placeholder="Ex: main">
        <select id="new-language">
            <option value=".html">HTML (.html)</option>
            <option value=".css">CSS (.css)</option>
            <option value=".js">JavaScript (.js)</option>
            <option value=".py">Python (.py)</option>
            <option value=".txt">Texto (.txt)</option>
        </select>
        <button onclick="createNewFile()">Criar</button>
    </div>

    <script>
        // File Storage system
        const files = {
            'index.html': { lang: 'html', icon: 'icon-html', emoji: '📄', content: '<h1>Olá, NEXUS!</h1>\n<p>Edite o código e clique em Executar.</p>' },
            'style.css': { lang: 'css', icon: 'icon-css', emoji: '🎨', content: 'h1 { color: #6366f1; }' },
            'script.js': { lang: 'js', icon: 'icon-js', emoji: '⚡', content: 'console.log("Sistema iniciado.");' }
        };

        let currentFile = 'index.html';
        const editor = document.getElementById('code-editor');

        // Load initial content
        editor.value = files[currentFile].content;

        // Automatically save to the object when typing
        editor.addEventListener('input', () => {
            if(currentFile) {
                files[currentFile].content = editor.value;
            }
        });

        function switchFile(filename) {
            currentFile = filename;
            editor.value = files[filename].content;
            
            // Update active states
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            // Try to find the matching elements and add active
            const items = document.querySelectorAll('.file-item');
            items.forEach(item => {
                if(item.textContent.includes(filename)) item.classList.add('active');
            });
            
            const tab = document.getElementById('tab-' + filename);
            if(tab) tab.classList.add('active');
        }

        function toggleModal() {
            const modal = document.getElementById('lang-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function createNewFile() {
            const name = document.getElementById('new-filename').value || 'untitled';
            const ext = document.getElementById('new-language').value;
            const fullName = name + ext;
            
            if(files[fullName]) {
                alert('Arquivo já existe!');
                return;
            }

            let iconClass = 'icon-other';
            let emoji = '📄';
            if(ext === '.html') { iconClass = 'icon-html'; emoji = '📄'; }
            if(ext === '.css') { iconClass = 'icon-css'; emoji = '🎨'; }
            if(ext === '.js') { iconClass = 'icon-js'; emoji = '⚡'; }
            if(ext === '.py') { iconClass = 'icon-py'; emoji = '🐍'; }

            // Add to storage
            files[fullName] = { lang: ext.substring(1), icon: iconClass, emoji: emoji, content: '' };

            // Add to Sidebar
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `<span class="${iconClass}">${emoji}</span> ${fullName}`;
            li.onclick = () => switchFile(fullName);
            document.getElementById('file-list').appendChild(li);

            // Add to Tabs
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.id = 'tab-' + fullName;
            tab.innerHTML = `<span class="${iconClass}">${emoji}</span> ${fullName}`;
            tab.onclick = () => switchFile(fullName);
            document.getElementById('tabs').appendChild(tab);

            toggleModal();
            switchFile(fullName);
        }

        function runCode() {
            // Check if we have HTML to run
            let htmlContent = '';
            let cssContent = '';
            let jsContent = '';

            // Find first HTML, CSS and JS files
            for(let key in files) {
                if(key.endsWith('.html') && !htmlContent) htmlContent = files[key].content;
                if(key.endsWith('.css') && !cssContent) cssContent = files[key].content;
                if(key.endsWith('.js') && !jsContent) jsContent = files[key].content;
            }

            if(!htmlContent && !jsContent) {
                alert('Aviso: O preview web requer arquivos HTML/JS. Outras linguagens precisam de backend para executar.');
                return;
            }

            const previewFrame = document.getElementById('preview-frame');
            const content = `
                <!DOCTYPE html>
                <html>
                <head><style>${cssContent}</style></head>
                <body>
                    ${htmlContent}
                    <script>${jsContent}<\/script>
                </body>
                </html>
            `;
            const blob = new Blob([content], { type: 'text/html' });
            previewFrame.src = URL.createObjectURL(blob);
        }

        // Initial run
        window.onload = runCode;
    </script>
</body>
</html>
